# betomcat model pool (spec s5). Hot-editable, re-read on every draw.
#
# tier: frontier | free | cheap. Frontier spend is only ever permitted for the
# two forecast-generating model calls (spec s5); every other gate in this
# codebase must stay off this file's frontier entries.
# reasoning: passed through verbatim as OpenRouter's `reasoning` param.
# key: funded | free | google -- which key routes this model's calls
#   (budget.py). funded/free are the two OpenRouter keys; google calls
#   Google's OpenAI-compatible endpoint directly with GEMINI_API_KEY (free
#   tier, so the budget guard never paces it out) and is only used when set
#   explicitly. Omit to use the default: `:free` ids route to the free key,
#   except `google/`-prefixed ones, which stay on the funded key (its
#   allowed-providers list includes google-ai-studio).
# price_in/price_out: USD per million tokens, for the budget guard's
#   price-based cost estimate before enough ledger history exists.
# context_tokens: the model's context window, for the budget guard's
#   prompt-fit filter.

ensemble_width: 2

models:
